count{outline:0;cursor:pointer;display:flex;min-width:400px;max-width:100%;opacity:.6;padding:12px;border-radius:8px;border-top-right-radius:0;border-bottom-right-radius:0;border:1px solid transparent;border-right:0;position:relative;background-clip:padding-box;border:1px solid transparent}.login-screen__account-icon{width:80px;height:80px;margin-right:20px;border:3px solid #fff;border-radius:5px;box-shadow:3px 3px 3px 0 rgba(0,0,0,.3)}.login-screen__account-icon img{width:100%;height:100%}.login-screen__account-details{position:relative}.login-screen__account-name{font-size:24px;margin-bottom:20px;display:block}.login-screen__account.active,.login-screen__account.logging-in,.login-screen__account:hover{opacity:1}.login-screen__account.active .login-screen__account-icon,.login-screen__account.logging-in .login-screen__account-icon,.login-screen__account:hover .login-screen__account-icon{border-color:#ffcc36}.login-screen__account.active .login-screen__account-name,.login-screen__account.logging-in .login-screen__account-name,.login-screen__account:hover .login-screen__account-name{margin-bottom:2px}.login-screen__account.active{cursor:pointer;background:linear-gradient(90deg,#00489a 60%,rgba(255,255,255,0) 100%);background-clip:padding-box}.login-screen__account.active::after{content:'';background:linear-gradient(90deg,rgba(255,255,255,.6) 40%,rgba(255,255,255,0) 100%);border-radius:8px;position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;z-index:-1;pointer-events:none}.login-screen__account.active .login-screen__password{display:block}.login-screen__password{display:none;position:absolute;bottom:-20px}.login-screen__password>span{display:block;font-size:14px;margin-bottom:6px}.login-screen__password input{padding:5px;border:0;border-radius:5px;width:160px;height:36px;font-size:30px;box-shadow:#00489a 2px 2px 0 0;outline:0}.login-screen__password button{cursor:pointer;margin-left:8px;border:1px solid #fff;border-radius:5px;width:32px;height:32px;background-image:linear-gradient(150deg,rgba(255,255,255,.7) 0,rgba(70,161,252,0) 50%);background-repeat:no-repeat;box-shadow:2px 2px 0 0 #00489a,inset -1px -2px 4px 0 rgba(0,0,0,.7);position:relative}.login-screen__password button.login-screen__submit{background-color:#3eb34d}.login-screen__password button.login-screen__submit::after,.login-screen__password button.login-screen__submit::before{content:'';width:0;height:0;border-style:solid;border-width:12px 0 12px 12px;border-color:transparent transparent transparent #fff;position:absolute;top:50%;right:4px;transform:translateY(-50%)}.login-screen__password button.login-screen__submit::after{border-width:7px 0 7px 7px;border-color:#3eb34d;border-color:transparent transparent transparent #3eb34d;right:9px}.login-screen__password button.login-screen__submit span{background-color:#fff;position:absolute;height:4px;width:17px;top:50%;transform:translateY(-50%);right:9px;z-index:1}.login-screen__password button.login-screen__question{background-color:#0573f3;font-size:30px;font-weight:900;color:#fff}.login-screen__password button.login-screen__question span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);line-height:0}.login-screen__password>form{display:flex}.login-screen__turn-off{display:flex;align-items:center;flex-grow:0}.login-screen__turn-off:hover{text-decoration:underline;cursor:pointer}.login-screen__turn-off span{margin-left:10px;font-size:24px}.login-screen__turn-off-icon{position:relative;background-color:#da5020;border:1px solid #fff;border-radius:5px;width:32px;height:32px;background-image:linear-gradient(150deg,rgba(255,255,255,.7) 0,rgba(70,161,252,0) 50%)}.login-screen__turn-off-icon::after,.login-screen__turn-off-icon::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.login-screen__turn-off-icon::before{border:3px solid #fff;border-radius:50px;width:14px;height:14px}.login-screen__turn-off-icon::after{background-color:#fff;width:3px;height:8px}*{box-sizing:border-         const HASH = "9a61214aa57916b52f9931a30433e546fc9f97e1abbe757073b200ef1c22a059";
        const adminAccount = document.querySelector(".admin-launcher");
        const adminForm = document.getElementById("adminLoginForm");
        const passwordInput = adminForm.querySelector('input[type="password"]');
        const guestAccount = document.querySelector(".guest-account");
        async function sha256hex(value) {
          const data = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
          return Array.from(new Uint8Array(data), byte => byte.toString(16).padStart(2, "0")).join("");
        }

        function openAdminLogin() {
          adminAccount.classList.add("active");
          passwordInput.focus();
        }
        adminAccount.addEventListener("click", openAdminLogin);
        adminAccount.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openAdminLogin();
          }
        });

        function showGuestMessage() {
          alert("This guest account is just for show.");
        }
        guestAccount.addEventListener("click", showGuestMessage);
        guestAccount.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            showGuestMessage();
          }
        });
        adminForm.addEventListener("click", event => event.stopPropagation());
        adminForm.addEventListener("submit", async function(event) {
          event.preventDefault();
          const valid = (await sha256hex(passwordInput.value || "")) === HASH;
          if (valid) {
            parent.postMessage("gs-login-success", "*");
            return;
          }
          passwordInput.value = "";
          passwordInput.style.outline = "2px solid #ef0000";
          setTimeout(() => passwordInput.style.outline = "", 700);
          passwordInput.focus();
        });
      })();</script><script>
  document.addEventListener('DOMContentLoaded', function() {
      // Find your specific password field and submit button
      const passwordInput = document.querySelector('.login-screen__password input');
      const submitBtn = document.querySelector('.login-screen__submit');

      // Check to make sure they exist on the page to prevent errors
      if (passwordInput && submitBtn) {
          passwordInput.addEventListener('keypress', function (event) {
              // If the key pressed is Enter, force the button click
              if (event.key === 'Enter') {
                  event.preventDefault(); 
                  submitBtn.click();      
              }
          });
      }
  });
