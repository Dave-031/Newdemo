<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #app { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ---- EDIT THIS ARRAY: add as many URLs as you need (2, 3, 15, etc.) ----
  const PART_URLS = [
    "https://yourhost.com/part1.txt",
    "https://yourhost.com/part2.txt",
    "https://yourhost.com/part3.txt"
  ];
  // --------------------------------------------------------------------

  async function loadHtmlFromUrlParts(urls, targetElementId) {
    if (!Array.isArray(urls) || urls.length === 0) {
      throw new Error("urls must be a non-empty array");
    }

    // Fetch all parts, in order, keeping track of which URL each came from
    // so a failure points at the right chunk instead of a generic error.
    const chunks = new Array(urls.length);
    const results = await Promise.allSettled(
      urls.map((url) => fetch(url).then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
        return res.text();
      }))
    );

    results.forEach((result, i) => {
      if (result.status === "rejected") {
        throw new Error(`Failed to fetch part ${i + 1} (${urls[i]}): ${result.reason}`);
      }
      chunks[i] = result.value.trim();
    });

    // Join in array order -- works whether there are 2 parts or 15.
    const fullBase64 = chunks.join("");

    // Decode base64 -> UTF-8 string (handles non-ASCII correctly).
    const binary = atob(fullBase64);
    const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
    const html = new TextDecoder("utf-8").decode(bytes);

    // Render into an iframe via srcdoc. This runs the HTML (including any
    // <script> tags inside it) in its own document, rather than injecting
    // it directly into this page's DOM/scope.
    const target = document.getElementById(targetElementId);
    if (!target) {
      throw new Error(`No element with id "${targetElementId}" found`);
    }

    const iframe = document.createElement("iframe");
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.srcdoc = html;

    target.innerHTML = "";
    target.appendChild(iframe);

    return html;
  }

  loadHtmlFromUrlParts(PART_URLS, "app").catch((err) => {
    document.getElementById("app").innerHTML =
      "<pre style='color:red;font-family:monospace;padding:16px'>" +
      "Reassembly error: " + err.message + "</pre>";
  });
</script>
</body>
</html>
