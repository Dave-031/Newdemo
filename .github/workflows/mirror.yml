name: Push Mirror to GitLab

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          # Changed to standard Git SSH syntax below:
          target_repo_url: "git@gitlab.com:FunnySquib/Newdemo.git"
          ssh_private_key: ${{ secrets.GITLABSSH }}
