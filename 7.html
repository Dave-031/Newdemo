
<!DOCTYPE html>
<html lang="en-US" dir="ltr" class="hydrated">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=0.7,user-scalable=no">
    <title>Bright Future | sign in</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/css/vue-app.0e694d3a.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/css/logon-base.31cf226e.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/css/logon-win7.06ff7bff.css">
    <style>
      :root {
        --border-color: #d6e5f5;
        --link-color: #06c;
        --link-color--hover: #39f;
        --menu-radio: 8px;
        --progress-bg: #0bd82c;
        --progress-bg--paused: #e6df1b;
        --progress-bg--error: #ef0000;
        --progress-bg--meter: #069eb4;
        --radio-dot-size: 8px;
        --slider-height: 3px;
        --slider-thumb-width: 11px;
        --slider-thumb-height: 19px;
        font-family: "Segoe UI", sans-serif;
        font-size: 9pt;
      }

      .logon__form-input--error {
        outline: 2px solid #ef0000 !important;
        animation: logon-shake 0.4s;
      }

      @keyframes logon-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }
    </style>
  </head>
  <body>
    <div class="relative flex flex-col justify-center items-center bg-white bg-no-repeat bg-center w-screen h-screen logon__main bg-cover text-white is-win7" style="background-image: url(https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/images/login.85fd59c8.webp);">
      
      <main>
        <section class="flex flex-col items-center gap-4 -translate-y-12 logon__pane">
          <button class="is-win7 center-flex p-0 overflow-hidden avatar-button" style="--avatar-frame: url(https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/images/acc-frame.8481679a.webp);" tabindex="-1">
            <span class="avatar-mask">
              <img src="https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/images/admin.c6a62b2c.webp" alt="User avatar" class="block avatar-image" width="98" height="98">
            </span>
          </button>
          
          <div class="font-bold text-3xl logon__name">Admin</div>
          
          <form class="flex flex-col items-center gap-3 rounded-sm focus-visible:outline-current focus-visible:outline-dashed focus-visible:outline-offset-4 logon__form">
            <div class="relative flex flex-col gap-3">
              <div class="relative">
                <input placeholder="Password" type="password" class="py-2 pr-10 pl-2 logon__form-input">
              </div>
              <button type="submit" aria-label="Login" class="left-full absolute flex justify-center items-center ml-3 p-0 rounded-full w-12 h-12 logon__form-submit">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="0.92em" height="1em" viewBox="0 0 1472 1600" class="text-xl iconify iconify--fa">
                  <g transform="translate(1472 0) scale(-1 1)">
                    <path fill="currentColor" d="M1472 736v128q0 53-32.5 90.5T1355 992H651l293 294q38 36 38 90t-38 90l-75 76q-37 37-90 37q-52 0-91-37L37 890Q0 853 0 800q0-52 37-91L688 59q38-38 91-38q52 0 90 38l75 74q38 38 38 91t-38 91L651 608h704q52 0 84.5 37.5T1472 736"></path>
                  </g>
                </svg>
              </button>
            </div>
          </form>
        </section>
      </main>

      <div data-v-1c9a6f46="" class="bottom-6 absolute center-flex gap-2 logon__brand">
        <img data-v-1c9a6f46="" src="https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/images/start-button-classic.ec7b0b9f.webp" width="32" height="32" class="w-8 h-8 logon__brand-icon">
        <span data-v-1c9a6f46="" class="text-3xl">Windows <sup data-v-1c9a6f46="" class="text-xs">®</sup> 7 </span>
      </div>
      
      <div class="shutdown-group right-8 bottom-6 z-0 absolute flex" data-v-1c9a6f46="" style="--bg: url(https://cdn.jsdelivr.net/gh/Dave-031/bazinga-games@main/bright%20future/images/shutdown.08d3f74a.webp);">
        <button aria-label="Shut down" class="shutdown-button"></button>
        <div class="shutdown-dropdown">
        </div>
      </div>
      
    </div> <!-- Added missing closing div here -->

    <!-- Minimal script to prevent page reload on form submit -->
    <script>
      const form = document.querySelector('.logon__form');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const el = form.querySelector('input[type="password"]');
        window.__tryLogin(el.value, el);
      });
    </script>
  
<script>
(function(){
  const HASH="9a61214aa57916b52f9931a30433e546fc9f97e1abbe757073b200ef1c22a059";
  async function sha256hex(s){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  window.__tryLogin = async function(value, inputEl){
    const ok = (await sha256hex(value || "")) === HASH;
    if (ok) { parent.postMessage("gs-login-success","*"); return true; }
    if (inputEl){
      inputEl.value = "";
      inputEl.classList.add("logon__form-input--error");
      inputEl.style.outline = "2px solid #ef0000";
      setTimeout(()=>{ inputEl.classList.remove("logon__form-input--error"); inputEl.style.outline=""; }, 700);
      inputEl.focus();
    }
    return false;
  };
  window.addEventListener("load", function(){
    const el = document.querySelector('input[type="password"]');
    if (el) el.focus();
  });
})();
</script>
</body>
</html>
